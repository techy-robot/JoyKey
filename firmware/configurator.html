<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QMK Advanced Configurator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.2em; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85em; color: #555; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        /* Color Picker Styling */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 40px;
            cursor: pointer;
            padding: 0;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid #ccc; border-radius: 4px; }

        input[type="range"] { width: 100%; margin-top: 5px; }

        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin-top: 15px; width: 100%; font-size: 1em; transition: background 0.2s;}
        button:hover { background: #0056b3; }

        .row { display: flex; gap: 10px; align-items: flex-end; }
        .col { flex: 1; }
        
        .status { font-size: 0.9em; color: #666; margin-top: 10px; text-align: center; }
        .hidden { display: none; }
        .section-header { font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; color: #999; margin-top: 15px; margin-bottom: 5px; }
        
        .val-display { float: right; font-weight: normal; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Connection</h2>
        <button id="connectBtn">Connect Keyboard</button>
        <div id="statusMsg" class="status">Waiting for device...</div>
    </div>

    <div id="controls" class="hidden">
        
        <div class="card">
            <h2>Layer Config</h2>
            <label>Select Layer</label>
            <select id="layerSelect" onchange="fetchLayerInfo()"></select>

            <div class="section-header">Metadata</div>
            <div class="row">
                <div class="col">
                    <label>Layer Name (10)</label>
                    <input type="text" id="layerName" maxlength="10">
                </div>
                <div class="col">
                    <label>Image Asset (10)</label>
                    <input type="text" id="layerImage" maxlength="10">
                </div>
            </div>

            <div class="section-header">Lighting Effect</div>
            <div class="row">
                <div class="col">
                    <label>Effect ID (0-255)</label>
                    <input type="number" id="layerEffect" min="0" max="255" value="0">
                </div>
                <div class="col">
                    <label>Speed (0-255)</label>
                    <input type="number" id="layerSpeed" min="0" max="255" value="128">
                </div>
            </div>

            <div class="section-header">Base Color</div>
            <div class="row">
                <div class="col" style="flex: 0.4;">
                    <label>Color</label>
                    <input type="color" id="layerColorInput" value="#ff0000" oninput="onColorPickerChange('layer')">
                </div>
                <div class="col">
                    <label>Brightness (Val) <span id="layerValDisp" class="val-display">255</span></label>
                    <input type="range" id="layerValSlider" min="0" max="255" value="255" oninput="onBrightnessChange('layer')">
                </div>
            </div>
            
            <button onclick="sendLayerInfo()">Update Layer Settings</button>
        </div>

        <div class="card">
            <h2>Key Config</h2>
            <label>Select Key</label>
            <select id="keySelect" onchange="fetchKeyInfo()"></select>

            <div class="section-header">Metadata</div>
            <div class="row">
                <div class="col">
                    <label>Key Name (10)</label>
                    <input type="text" id="keyName" maxlength="10">
                </div>
                <div class="col">
                    <label>Image Asset (10)</label>
                    <input type="text" id="keyImage" maxlength="10">
                </div>
            </div>

            <div class="section-header">Override Color</div>
            <div class="row">
                <div class="col" style="flex: 0.4;">
                    <label>Color</label>
                    <input type="color" id="keyColorInput" value="#ff0000" oninput="onColorPickerChange('key')">
                </div>
                <div class="col">
                    <label>Brightness (Val) <span id="keyValDisp" class="val-display">255</span></label>
                    <input type="range" id="keyValSlider" min="0" max="255" value="255" oninput="onBrightnessChange('key')">
                </div>
            </div>

            <button onclick="sendKeyInfo()">Update Key Settings</button>
        </div>
        
        <div class="card">
             <button class="save" onclick="saveToEEPROM()">Save Changes to Memory</button>
        </div>
    </div>

    <script>
        let device = null;
        const QMK_USAGE_PAGE = 0xFF60;
        
        // --- CONSTANTS ---
        const CMD_SET  = 0x07;
        const CMD_GET  = 0x08;
        const CMD_SAVE = 0x09;
        
        const CHANNEL_ID = 0;
        const ID_BULK_LAYER = 1;
        const ID_BULK_KEY   = 2;

        // Current state objects to hold QMK HSV values
        const state = {
            layer: { h: 0, s: 0, v: 0 },
            key: { h: 0, s: 0, v: 0 }
        };

        // Populate Dropdowns
        const layerSelect = document.getElementById('layerSelect');
        for(let i=0; i<16; i++) layerSelect.add(new Option(`Layer ${i}`, i));

        const keySelect = document.getElementById('keySelect');
        for(let i=0; i<12; i++) keySelect.add(new Option(`Key ${i}`, i));

        // --- Connection ---
        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                const devices = await navigator.hid.requestDevice({ filters: [{ usagePage: QMK_USAGE_PAGE }] });
                if (devices.length === 0) return;
                
                device = devices[0];
                await device.open();
                device.addEventListener('inputreport', handleInputReport);

                document.getElementById('statusMsg').textContent = `Connected: ${device.productName}`;
                document.getElementById('statusMsg').style.color = "green";
                document.getElementById('controls').classList.remove('hidden');
                document.getElementById('connectBtn').classList.add('hidden');

                fetchLayerInfo();

            } catch (err) {
                console.error(err);
                alert("Connection failed: " + err.message);
            }
        });

        // --- Color Math Helpers ---
        
        // Convert QMK HSV (0-255, 0-255, 0-255) to Hex for Color Picker
        function qmkHsvToHex(h, s, v) {
            // 1. QMK H(0-255) -> Deg(0-360)
            const h_deg = (h / 255) * 360;
            const s_norm = s / 255;
            const v_norm = v / 255;

            // HSV to RGB
            const f = (n, k=(n+h_deg/60)%6) => v_norm - v_norm*s_norm*Math.max(Math.min(k, 4-k, 1), 0);
            
            const r = Math.round(f(5) * 255);
            const g = Math.round(f(3) * 255);
            const b = Math.round(f(1) * 255);

            // RGB to Hex
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        // Convert Hex to QMK HSV
        function hexToQmkHsv(hex) {
            let r = 0, g = 0, b = 0;
            if (hex.length === 4) {
                r = "0x" + hex[1] + hex[1];
                g = "0x" + hex[2] + hex[2];
                b = "0x" + hex[3] + hex[3];
            } else if (hex.length === 7) {
                r = "0x" + hex[1] + hex[2];
                g = "0x" + hex[3] + hex[4];
                b = "0x" + hex[5] + hex[6];
            }
            r /= 255; g /= 255; b /= 255;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max;
            const d = max - min;
            s = max === 0 ? 0 : d / max;

            if (max === min) {
                h = 0; 
            } else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }

            // Scale to QMK 0-255
            return {
                h: Math.round(h * 255),
                s: Math.round(s * 255),
                v: Math.round(v * 255)
            };
        }

        // --- UI Logic ---
        
        // Triggered when User moves the Color Picker
        function onColorPickerChange(type) {
            const hex = document.getElementById(`${type}ColorInput`).value;
            const qmkHSV = hexToQmkHsv(hex);
            
            // Note: The Color Picker inherently calculates a Value based on the color picked.
            // If the user picked a bright red, V is 255. If they picked dark red, V is lower.
            // We update our state:
            state[type].h = qmkHSV.h;
            state[type].s = qmkHSV.s;
            state[type].v = qmkHSV.v;

            // Sync the slider to the picker's implicit brightness
            document.getElementById(`${type}ValSlider`).value = state[type].v;
            document.getElementById(`${type}ValDisp`).textContent = state[type].v;
        }

        // Triggered when User moves the Brightness Slider
        function onBrightnessChange(type) {
            const newVal = parseInt(document.getElementById(`${type}ValSlider`).value);
            state[type].v = newVal;
            document.getElementById(`${type}ValDisp`).textContent = newVal;

            // Update the Color Picker visual to match the new brightness
            // We keep the old H and S, but apply the new V
            const newHex = qmkHsvToHex(state[type].h, state[type].s, state[type].v);
            document.getElementById(`${type}ColorInput`).value = newHex;
        }

        // Helpers for String bytes
        function stringFromBytes(data, start, maxLength) {
            let str = "";
            for (let i = 0; i < maxLength; i++) {
                if (data[start + i] === 0) break;
                str += String.fromCharCode(data[start + i]);
            }
            return str;
        }

        function bytesFromString(str, maxLength) {
            const bytes = [];
            for (let i = 0; i < maxLength; i++) {
                bytes.push(i < str.length ? str.charCodeAt(i) : 0);
            }
            return bytes;
        }

        // --- Fetch Functions ---
        async function fetchLayerInfo() {
            if(!device) return;
            const layer = parseInt(layerSelect.value);
            const packet = new Uint8Array(32);
            packet[0] = CMD_GET; 
            packet[1] = CHANNEL_ID; 
            packet[2] = ID_BULK_LAYER; 
            packet[3] = layer; 
            await device.sendReport(0, packet);
            setTimeout(fetchKeyInfo, 50); 
        }

        async function fetchKeyInfo() {
            if(!device) return;
            const layer = parseInt(layerSelect.value);
            const key = parseInt(keySelect.value);
            const packet = new Uint8Array(32);
            packet[0] = CMD_GET;
            packet[1] = CHANNEL_ID;
            packet[2] = ID_BULK_KEY;
            packet[3] = layer;
            packet[4] = key;
            await device.sendReport(0, packet);
        }

        // --- Send Functions ---
        async function sendLayerInfo() {
            const layer = parseInt(layerSelect.value);
            const nameBytes = bytesFromString(document.getElementById('layerName').value, 10);
            const imgBytes = bytesFromString(document.getElementById('layerImage').value, 10);
            const eff = parseInt(document.getElementById('layerEffect').value) || 0;
            const spd = parseInt(document.getElementById('layerSpeed').value) || 0;

            const packet = new Uint8Array(32);
            packet[0] = CMD_SET;
            packet[1] = CHANNEL_ID;
            packet[2] = ID_BULK_LAYER;
            packet[3] = layer;

            packet.set(nameBytes, 4);   
            packet.set(imgBytes, 14);   
            packet[24] = eff;
            packet[25] = spd;
            
            // Use stored state
            packet[26] = state.layer.h;
            packet[27] = state.layer.s;
            packet[28] = state.layer.v;

            await device.sendReport(0, packet);
            console.log(`Layer Sent: H${state.layer.h} S${state.layer.s} V${state.layer.v}`);
        }

        async function sendKeyInfo() {
            const layer = parseInt(layerSelect.value);
            const key = parseInt(keySelect.value);
            const nameBytes = bytesFromString(document.getElementById('keyName').value, 10);
            const imgBytes = bytesFromString(document.getElementById('keyImage').value, 10);

            const packet = new Uint8Array(32);
            packet[0] = CMD_SET;
            packet[1] = CHANNEL_ID;
            packet[2] = ID_BULK_KEY;
            packet[3] = layer;
            packet[4] = key;

            packet.set(nameBytes, 5);
            packet.set(imgBytes, 15);
            
            // Use stored state
            packet[25] = state.key.h;
            packet[26] = state.key.s;
            packet[27] = state.key.v;

            await device.sendReport(0, packet);
            console.log(`Key Sent: H${state.key.h} S${state.key.s} V${state.key.v}`);
        }

        async function saveToEEPROM() {
            const packet = new Uint8Array(32);
            packet[0] = CMD_SAVE;
            packet[1] = CHANNEL_ID;
            await device.sendReport(0, packet);
            alert("Save command sent!");
        }

        // --- Handle Incoming ---
        function handleInputReport(e) {
            const data = new Uint8Array(e.data.buffer);
            if (data[0] !== CMD_GET || data[1] !== CHANNEL_ID) return;

            if (data[2] === ID_BULK_LAYER) {
                document.getElementById('layerName').value = stringFromBytes(data, 4, 10);
                document.getElementById('layerImage').value = stringFromBytes(data, 14, 10);
                document.getElementById('layerEffect').value = data[24];
                document.getElementById('layerSpeed').value = data[25];
                
                // Update State
                state.layer.h = data[26];
                state.layer.s = data[27];
                state.layer.v = data[28];

                // Update UI
                const hex = qmkHsvToHex(state.layer.h, state.layer.s, state.layer.v);
                document.getElementById('layerColorInput').value = hex;
                document.getElementById('layerValSlider').value = state.layer.v;
                document.getElementById('layerValDisp').textContent = state.layer.v;
            } 
            else if (data[2] === ID_BULK_KEY) {
                document.getElementById('keyName').value = stringFromBytes(data, 5, 10);
                document.getElementById('keyImage').value = stringFromBytes(data, 15, 10);
                
                // Update State
                state.key.h = data[25];
                state.key.s = data[26];
                state.key.v = data[27];

                // Update UI
                const hex = qmkHsvToHex(state.key.h, state.key.s, state.key.v);
                document.getElementById('keyColorInput').value = hex;
                document.getElementById('keyValSlider').value = state.key.v;
                document.getElementById('keyValDisp').textContent = state.key.v;
            }
        }
    </script>
</body>
</html>
